{
  "services": [
    {
      "name": "lut_evidence",
      "path": [ "/system/bin/sh", "/system/bin/lut_evidence.sh" ],
      "uid": "root",
      "gid": [ "root" ],
      "secon": "u:r:init:s0",
      "start-mode": "boot",
      "once": 1,
      "importance": 0,
      "disabled": 0,
      "permission": [
        "ohos.permission.ACCESSIBILITY_EXTENSION_ABILITY",
        "ohos.permission.QUERY_ACCESSIBILITY_ELEMENT",
        "ohos.permission.CAPTURE_SCREEN"
      ],
      "permission_acls": [
        "ohos.permission.INJECT_INPUT_EVENT"
      ]
    }
  ]
}
